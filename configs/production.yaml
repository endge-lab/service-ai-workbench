app:
  env: production
  name: service_ai_workbench
  version: 0.1.0
  public_url: https://ai-workbench.example.com
http:
  port: "8080"
  cors_allowed_origins: https://cors-disabled.invalid
logger:
  level: info
postgres:
  host: localhost
  port: 5432
  user: postgres
  database: service_ai_workbench
  schema: public
  sslmode: disable
  migrations_enabled: false
auth:
  enabled: false
  jwks_path: /.well-known/jwks.json
  jwks_cache_ttl: 5m
  timeout: 5s
telemetry:
  enabled: false
  otlp_insecure: false
redpanda:
  enabled: false
  client_id: service_ai_workbench
  dial_timeout: 5s
  read_batch_timeout: 2s
  write_timeout: 10s
