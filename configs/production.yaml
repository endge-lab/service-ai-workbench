app:
  env: production
  name: service_ai_workbench
  version: 0.3.0
  public_url: https://ai-workbench.example.com
http:
  port: "8080"
  cors_allowed_origins: https://cors-disabled.invalid
grpc:
  enabled: true
  port: 50051
  max_receive_bytes: 33554432
  max_send_bytes: 16777216
  graceful_stop_timeout: 10s
logger:
  level: info
postgres:
  host: localhost
  port: 5432
  user: postgres
  database: service_ai_workbench
  schema: public
  sslmode: require
  migrations_enabled: true
auth:
  enabled: false
  jwks_path: /.well-known/jwks.json
  jwks_cache_ttl: 5m
  timeout: 5s
service_identity:
  verifier:
    enabled: true
    allowed_algorithms: RS256
    jwks_cache_ttl: 5m
    timeout: 5s
telemetry:
  enabled: false
  otlp_insecure: false
redpanda:
  enabled: false
  client_id: service_ai_workbench
  dial_timeout: 5s
  read_batch_timeout: 2s
  write_timeout: 10s
