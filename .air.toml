root = "."
tmp_dir = "tmp"

[build]
cmd = "make BIN=./tmp/main build"
entrypoint = ["./tmp/main"]
include_ext = ["go", "sql", "yaml"]
include_file = ["VERSION"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
level = "debug"
time = true
